<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 148 32" width="148" height="32"
     fill="none" role="img" aria-label="RayMail">
  <rect x="10" y="7" width="19" height="18" rx="2.5" stroke="currentColor" stroke-width="2"/>
  <path d="M11.4 8.6 L19.5 16 L27.6 8.6" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="var(--rm-accent, currentColor)" stroke-width="2" stroke-linecap="round">
